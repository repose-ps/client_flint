plugins {
    id 'java'
    id 'application'
}

group = 'flint'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java.srcDirs = ['src']
    }
}

application {
    mainClass = 'rs2.client'
}

ext {
    lwjglVersion = '3.4.0'
    lwjglAwtVersion = '0.2.4'
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def lwjglNatives
if (osName.contains('win')) {
    lwjglNatives = arch.contains('aarch64') || arch.contains('arm64') ? 'natives-windows-arm64' :
            (arch.contains('86') && !arch.contains('64') ? 'natives-windows-x86' : 'natives-windows')
} else if (osName.contains('mac') || osName.contains('darwin')) {
    lwjglNatives = arch.contains('aarch64') || arch.contains('arm64') ? 'natives-macos-arm64' : 'natives-macos'
} else if (osName.contains('linux')) {
    lwjglNatives = arch.contains('aarch64') || arch.contains('arm64') ? 'natives-linux-arm64' :
            (arch.startsWith('arm') ? 'natives-linux-arm32' : 'natives-linux')
} else {
    throw new GradleException("Unsupported LWJGL platform: ${System.getProperty('os.name')} / ${System.getProperty('os.arch')}")
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-jawt'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation "org.lwjglx:lwjgl3-awt:${lwjglAwtVersion}"

    runtimeOnly "org.lwjgl:lwjgl::${lwjglNatives}"
    runtimeOnly "org.lwjgl:lwjgl-opengl::${lwjglNatives}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('rendererGoldenTest', JavaExec) {
    group = 'verification'
    description = 'Runs the software renderer golden regression suite.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.RendererGoldenTest'
}

tasks.register('clientSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the complete cache-free client self-test suite.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.ClientSelfTest'
}

tasks.register('gpuBootstrapSelfTest', JavaExec) {
    group = 'verification'
    description = 'Creates a real OpenGL 3.3 AWT context and validates the Phase 1 test triangle.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuBootstrapSelfTest'
}



tasks.register('gpuTerrainMeshSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates the Phase 2 full-scene terrain mesh extraction without requiring OpenGL.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuTerrainMeshSelfTest'
}

tasks.register('gpuTerrainSelfTest', JavaExec) {
    group = 'verification'
    description = 'Creates a real OpenGL 3.3 context and validates the Phase 2 terrain draw path.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuTerrainSelfTest'
}

tasks.named('run', JavaExec) {
    ['flint.renderer', 'flint.renderFps', 'flint.gpu.perfStats', 'flint.frameStats'].each { propertyName ->
        def value = System.getProperty(propertyName)
        if (value != null) {
            systemProperty propertyName, value
        }
    }
}

tasks.register('runGpu', JavaExec) {
    group = 'application'
    description = 'Runs Flint with the GPU scene renderer and decoupled presentation timing.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.client'
    systemProperty 'flint.renderer', 'gpu'
    def renderFps = System.getProperty('flint.renderFps')
    if (renderFps != null) {
        systemProperty 'flint.renderFps', renderFps
    }
    def perfStats = System.getProperty('flint.gpu.perfStats')
    if (perfStats != null) {
        systemProperty 'flint.gpu.perfStats', perfStats
    }
    def frameStats = System.getProperty('flint.frameStats')
    if (frameStats != null) {
        systemProperty 'flint.frameStats', frameStats
    }
}

tasks.register('gpuStaticSceneMeshSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates the Phase 3 static scene model extraction without requiring OpenGL.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuStaticSceneMeshSelfTest'
}

tasks.register('gpuStaticSceneSelfTest', JavaExec) {
    group = 'verification'
    description = 'Creates a real OpenGL 3.3 context and validates the Phase 3 static model draw path.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuStaticSceneSelfTest'
}


tasks.register('frameTimingSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates decoupled render-rate configuration and camera interpolation.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.FrameTimingSelfTest'
}


tasks.register('gpuTextureSourceSelfTest', JavaExec) {
    group = 'verification'
    description = 'Validates revision-377 indexed texture expansion and GPU texture revisions without OpenGL.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuTextureSourceSelfTest'
}


tasks.register('gpuTerrainTextureSelfTest', JavaExec) {
    group = 'verification'
    description = 'Creates a real OpenGL 3.3 context and validates Phase 4 terrain texture-array sampling.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuTerrainTextureSelfTest'
}


tasks.register('gpuStaticTextureSelfTest', JavaExec) {
    group = 'verification'
    description = 'Creates a real OpenGL 3.3 context and validates Phase 4 projective static-model texture sampling.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'rs2.tools.GpuStaticTextureSelfTest'
}
